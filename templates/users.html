{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block heading %}User management{% endblock %}
{% block content %}
<div class="panel">
  <form method="post" class="toolbar mb-3">
    <input class="form-control" name="username" placeholder="Username" required>
    <input class="form-control" name="email" placeholder="Email" required>
    <input class="form-control" type="password" name="password" placeholder="Password" required>
    <select class="form-select" name="role">
      <option>INVESTIGATOR</option>
      <option>ADMIN</option>
    </select>
    <button class="btn btn-primary">Add user</button>
  </form>
  <table class="table table-dark">
    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Created</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr><td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.created_at }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
