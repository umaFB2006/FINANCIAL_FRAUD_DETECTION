{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block heading %}Error{% endblock %}
{% block content %}
<div class="panel">
  <h2>{{ message or "Page not found" }}</h2>
  <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
</div>
{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="login-card">
    <h1>{{ message or "Page not found" }}</h1>
    <a href="{{ url_for('login') }}">Go to login</a>
  </div>
</div>
{% endblock %}
